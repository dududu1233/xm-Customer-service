<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育智能客服 · 调试页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .chat-box {
    width: 520px;
    height: 700px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #4a7cf7;
    color: #fff;
    padding: 16px 20px;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-header .sub { font-size: 12px; font-weight: 400; opacity: .85; }
  .user-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    font-size: 13px;
    color: #555;
  }
  .user-bar input {
    width: 90px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f8fa;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #4a7cf7;
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #fff;
    color: #333;
    border: 1px solid #e8e8e8;
    border-bottom-left-radius: 2px;
  }
  .msg.bot.multi { background: #eef6ff; border-color: #cfe0ff; }
  .input-bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid #eee;
    background: #fff;
  }
  .input-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .input-bar input:focus { border-color: #4a7cf7; }
  .input-bar button {
    padding: 10px 22px;
    background: #4a7cf7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .input-bar button:hover { background: #3a6ae0; }
  .input-bar button:disabled { background: #a9bcf0; cursor: not-allowed; }
  .typing { color: #999; font-size: 13px; font-style: italic; padding: 4px 6px; }
  .quick-bar {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    background: #fff;
    border-top: 1px dashed #eee;
    flex-wrap: wrap;
  }
  .quick-bar button {
    font-size: 12px;
    padding: 4px 10px;
    border: 1px solid #d4dcf5;
    border-radius: 12px;
    background: #f4f7ff;
    color: #4a7cf7;
    cursor: pointer;
  }
  .quick-bar button:hover { background: #e4ecff; }
</style>
</head>
<body>

<div class="chat-box">
  <div class="chat-header">
    <span>🎓 教育智能客服</span>
    <span class="sub">http://127.0.0.1:18082/api/chat</span>
  </div>

  <div class="user-bar">
    用户ID：
    <input id="user-id" value="281" />
    <span style="color:#bbb">（对应 edu-data 里的 X-User-Id）</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-bar">
    <button onclick="quick('你好')">👋 问候</button>
    <button onclick="quick('查一下我的订单 ORD0000033548 的状态')">📦 查订单</button>
    <button onclick="quick('查一下通用编程入门班的学习进度')">📚 学习进度</button>
    <button onclick="quick('我要退款，订单号 ORD0000033548，课程不适合我')">💰 退款</button>
    <button onclick="quick('提交工单，订单 ORD0000033548，课程咨询：怎么下载学习资料')">🎫 工单</button>
  </div>

  <div class="input-bar">
    <input id="input" placeholder="输入消息，回车发送…" />
    <button id="send-btn" onclick="send()">发送</button>
  </div>
</div>

<script>
// 后端地址：edu-agent 服务（与页面同源，无跨域问题）
const API_BASE = "http://127.0.0.1:18082";

// 把一条消息加到聊天窗口
function appendMsg(role, text) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;   // 自动滚到底部
}

// 核心：把用户输入发到 /api/chat，拿到回复显示出来
async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  const senderId = document.getElementById("user-id").value.trim() || "281";

  appendMsg("user", text);
  input.value = "";
  setBusy(true);

  try {
    const resp = await fetch(API_BASE + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender_id: senderId, text: text })
    });
    const data = await resp.json();

    // 后端可能返回多条消息（如"好的，先处理XX" + 正式回复），逐条显示
    if (data.messages && data.messages.length) {
      data.messages.forEach((m, i) => appendMsg("bot", m.text || ""));
    } else {
      appendMsg("bot", "（没有收到回复）");
    }
  } catch (e) {
    appendMsg("bot", "请求失败：" + e.message + "（请确认 edu-agent 已在 18082 端口运行）");
  } finally {
    setBusy(false);
    document.getElementById("input").focus();
  }
}

function setBusy(busy) {
  document.getElementById("send-btn").disabled = busy;
}

// 快捷按钮：把示例话术塞进输入框并直接发送
function quick(text) {
  document.getElementById("input").value = text;
  send();
}

// 回车发送
document.getElementById("input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") send();
});

// 打开页面时显示欢迎语
appendMsg("bot", "你好！我是教育智能客服。可以帮你查订单、查学习进度、申请退款、提交工单。试试下面的快捷按钮，或直接输入消息。");
</script>
</body>
</html>
